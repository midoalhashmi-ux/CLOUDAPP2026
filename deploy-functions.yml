name: نشر Cloud Functions وقواعد Firestore

on:
  push:
    branches: [ main ]
    paths:
      - 'functions/**'
      - 'firestore.rules'
      - 'firebase.json'

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: تثبيت حزم الدالة
        working-directory: functions
        run: npm install

      - name: كتابة مفتاح حساب الخدمة
        run: echo '${{ secrets.FIREBASE_SERVICE_ACCOUNT }}' > ${{ github.workspace }}/service-account.json

      - name: نشر عبر Firebase CLI
        run: npx firebase-tools deploy --only functions,firestore:rules --project sports-stream-app-36a7a --non-interactive
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ github.workspace }}/service-account.json

      - name: حذف مفتاح حساب الخدمة
        if: always()
        run: rm -f ${{ github.workspace }}/service-account.json
