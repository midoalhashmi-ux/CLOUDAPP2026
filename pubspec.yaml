  # فيديو / بث HLS
  video_player: ^2.8.2
  chewie: ^1.7.5

  # إعلانات
  google_mobile_ads: ^4.0.0

  # إدارة الحالة
  provider: ^6.1.2
  url_launcher: ^6.3.1
  url_launcher: ^6.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
